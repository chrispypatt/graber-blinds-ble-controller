esphome:
  name: graber-identify
  friendly_name: Graber Blind Identifier
  min_version: 2026.4.0

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 300ms
    active: true
    continuous: true
  on_ble_advertise:
    then:
      - lambda: |-
          const std::string name = x.get_name();
          if (name.rfind("RRBZ_", 0) != 0) return;
          char address[MAC_ADDRESS_PRETTY_BUFFER_SIZE];
          const char *mac = x.address_str_to(address);
          bool reported_position = false;
          for (const auto &manufacturer : x.get_manufacturer_datas()) {
            if (manufacturer.data.size() >= 4 && manufacturer.data[2] <= 100) {
              ESP_LOGI("graber_identify",
                       "name=%s mac=%s rssi=%d bottom=%u top=%u",
                       name.c_str(), mac, x.get_rssi(),
                       manufacturer.data[2], manufacturer.data[3]);
              reported_position = true;
            }
          }
          if (!reported_position) {
            ESP_LOGI("graber_identify", "name=%s mac=%s rssi=%d position=unavailable",
                     name.c_str(), mac, x.get_rssi());
          }
