# Shared by all Graber controllers. Keep behavioral changes in the shared
# component; per-controller YAML is only identity, inventory and UI entities.
substitutions:
  graber_component_path: components

esphome:
  min_version: 2026.4.0
  name_add_mac_suffix: false
esp32:
  variant: esp32
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true
      flash_chip: generic
logger:
  level: INFO
api:
  encryption:
    key: !secret api_key
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
esp32_ble:
  max_connections: 3
esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 250ms
    active: true
    continuous: true
external_components:
  - source:
      type: local
      path: ${graber_component_path}
    components: [graber_dispatcher]

button:
  - platform: restart
    name: Restart Controller
    entity_category: diagnostic
  - platform: template
    name: Refresh Blind Batteries
    entity_category: diagnostic
    on_press:
      - lambda: esphome::graber_dispatcher::GraberDispatcher::request_all_batteries();
