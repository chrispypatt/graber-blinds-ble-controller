name: Validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ESPHome
        run: pip install esphome==2026.10.2
      - name: Prepare example secrets
        run: cp examples/secrets.yaml.example secrets.yaml
      - name: Run dispatcher tests
        run: make test
      - name: Compile mixed single/TDBU example
        run: make compile-example
      - name: Check discovery tool syntax
        run: python -m py_compile tools/*.py
