name: Validate Raspberry Pi controller

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install controller and test dependencies
        run: pip install -r linux_controller/requirements-dev.txt
      - name: Run Phase A tests and static checks
        run: make check
