<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graber Blinds Pi Pilot</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 70rem; margin: auto; padding: 1.2rem; }
    header { display: flex; justify-content: space-between; align-items: baseline; }
    #targets { display: grid; grid-template-columns: repeat(auto-fit,minmax(17rem,1fr)); gap: 1rem; }
    article { border: 1px solid #8886; border-radius: .7rem; padding: 1rem; }
    button { margin: .2rem; padding: .55rem .8rem; }
    .error { color: #d44; } .muted { opacity: .7; font-size: .9rem; }
  </style>
</head>
<body>
  <header><h1>Graber Blinds Pi Pilot</h1><span id="status">Loading…</span></header>
  <p class="muted">Commands are accepted only when live controls are explicitly enabled in private configuration.</p>
  <label class="muted">Optional control token <input id="token" type="password" autocomplete="off"></label>
  <main id="targets"></main>
  <script>
  const root = document.getElementById('targets');
  function escapeText(value) { const e=document.createElement('span'); e.textContent=String(value); return e.innerHTML; }
  async function command(id, action, position=null) {
    const token=document.getElementById('token').value;
    const response = await fetch(`/api/targets/${encodeURIComponent(id)}/commands`, {
      method:'POST', headers:{'Content-Type':'application/json', ...(token ? {'X-Graber-Control-Token':token} : {})}, body:JSON.stringify({action, ...(position === null ? {} : {position})})
    });
    const body=await response.json(); if(!response.ok) alert(body.error || 'Command rejected'); await refresh();
  }
  function addButton(card, id, label, action) {
    const button=document.createElement('button'); button.textContent=label; button.onclick=()=>command(id,action); card.appendChild(button);
  }
  function addPosition(card, id, label, action, value) {
    const row=document.createElement('div');
    const input=document.createElement('input'); input.type='range'; input.min='0'; input.max='100'; input.value=value ?? 50;
    const output=document.createElement('span'); output.textContent=` ${input.value}% `; input.oninput=()=>output.textContent=` ${input.value}% `;
    const button=document.createElement('button'); button.textContent=`Set ${label}`; button.onclick=()=>command(id,action,Number(input.value));
    row.append(label+' '); row.appendChild(input); row.appendChild(output); row.appendChild(button); card.appendChild(row);
  }
  function addCard(id, item, isGroup=false) {
    const card=document.createElement('article');
    const positions=isGroup ? '' : `<p>Bottom: ${escapeText(item.bottom ?? 'unknown')}%${item.dual_rail ? ` · Top: ${escapeText(item.top ?? 'unknown')}%` : ''} · Battery: ${escapeText(item.battery ?? 'unknown')}%</p>`;
    card.innerHTML=`<h2>${escapeText(item.name || id)}</h2>${positions}<p class="muted">${escapeText(item.last_command_status || (isGroup ? 'Group' : 'No command status'))}</p>`;
    for (const action of ['open','close','stop']) addButton(card,id,action[0].toUpperCase()+action.slice(1),action);
    if (!isGroup) addPosition(card,id,'Bottom','set_bottom_position',item.bottom);
    if (item.dual_rail && !isGroup) addPosition(card,id,'Top','set_top_position',item.top);
    if (item.dual_rail && !isGroup) { addButton(card,id,'Favorite','favorite'); addButton(card,id,'Stack Up','stack_up'); addButton(card,id,'Stack Down','stack_down'); }
    root.appendChild(card);
  }
  function addAdapter(id, item) {
    const card=document.createElement('article');
    card.innerHTML=`<h2>${escapeText(id)} Bluetooth</h2><p>Status: ${escapeText(item.status || 'unknown')}</p><p class="muted">Connections: ${escapeText(item.connection_successes ?? 0)}/${escapeText(item.connection_attempts ?? 0)} · Failures: ${escapeText(item.failures ?? 0)} · ${escapeText(item.last_error || '')}</p>`;
    root.appendChild(card);
  }
  async function refresh() {
    try {
      const response=await fetch('/api/state'); const state=await response.json();
      document.getElementById('status').textContent='Controller online'; root.innerHTML='';
      for (const [id, item] of Object.entries(state.blinds || {})) addCard(id,item);
      for (const [id, item] of Object.entries(state.groups || {})) addCard(id,item,true);
      for (const [id, item] of Object.entries(state.adapters || {})) addAdapter(id,item);
    } catch(error) { document.getElementById('status').innerHTML='<span class="error">Controller unavailable</span>'; }
  }
  refresh(); setInterval(refresh, 3000);
  </script>
</body>
</html>
