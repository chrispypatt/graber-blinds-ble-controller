<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Graber Identification</title><style>
body{font-family:system-ui,sans-serif;max-width:80rem;margin:auto;padding:1rem}header{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap}
#devices{display:grid;grid-template-columns:repeat(auto-fit,minmax(20rem,1fr));gap:1rem}.card{border:1px solid #8888;border-radius:.7rem;padding:1rem}
label{display:block;margin:.45rem 0}input,select,button{padding:.45rem}input[type=text],input[type=password]{width:95%}.warn{color:#b44}.muted{opacity:.7}
</style></head><body><h1>Graber identification & setup</h1>
<p class="warn">Jogging moves a real blind. Supervise the room and enable it only for identification.</p>
<header><input id="token" type="password" placeholder="Setup token" autocomplete="off"><input id="seconds" type="number" value="12" min="1" max="300"><button onclick="scan()">Scan adapters</button><button onclick="exportConfig()">Export configuration</button><span id="status"></span></header>
<main id="devices"></main><script>
const devices=document.getElementById('devices'); const token=()=>document.getElementById('token').value;
async function api(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Graber-Control-Token':token()},body:JSON.stringify(body||{})});if(!r.ok)throw new Error(await r.text());return r.json()}
async function refresh(){const r=await fetch('/api/state',{headers:{'X-Graber-Control-Token':token()}});if(!r.ok){document.getElementById('status').textContent='Enter the setup token';devices.innerHTML='';return}const s=await r.json();devices.innerHTML='';for(const d of s.devices){const e=document.createElement('section');e.className='card';const rails=d.dual_rail?`Bottom ${esc(d.bottom_position)}% · Top ${esc(d.top_position)}%`:`Position ${esc(d.bottom_position)}%`;e.innerHTML=`<h2>${esc(d.advertised_name)}</h2><p><strong>${rails}</strong> · RSSI ${esc(d.rssi_median)} dBm</p><label><input data-k="enabled" type="checkbox" ${d.enabled?'checked':''}> Include in export</label><label>ID <input data-k="id" value="${esc(d.id)}"></label><label>Name <input data-k="name" value="${esc(d.name)}"></label><label>Group <input data-k="group" value="${esc(d.group)}"></label><label>Adapter <select data-k="preferred_adapter">${s.adapters.map(a=>`<option ${a.id===d.preferred_adapter?'selected':''}>${esc(a.id)}</option>`).join('')}</select></label><label><input data-k="dual_rail" type="checkbox" ${d.dual_rail?'checked':''}> TDBU</label>${d.has_access_code?'<p>Credential loaded from private inventory</p>':`<label>Access code <input data-k="access_code" type="password" placeholder="7 digits"></label>`}${d.candidate_code_available?'<label><input data-k="use_candidate" type="checkbox"> Use read candidate code</label>':''}<button data-a="save">Save</button> ${s.allow_jog?'<button data-a="jog">Jog 5% and restore</button>':''}`;
e.onclick=async ev=>{const a=ev.target.dataset.a;if(!a)return;if(a==='jog'&&!confirm('Move this real blind 5% and attempt to restore it?'))return;const buttons=[...document.querySelectorAll('button')];buttons.forEach(x=>x.disabled=true);if(a==='jog')document.getElementById('status').textContent='Jog in progress…';try{let result;if(a==='save'){const b={};for(const x of e.querySelectorAll('[data-k]'))b[x.dataset.k]=x.type==='checkbox'?x.checked:x.value;result=await api(`/api/devices/${d.key}/configure`,b)}else result=await api(`/api/devices/${d.key}/${a}`);if(a==='jog')alert(result.restored?'Jog completed and original position restored':`Jog finished but restoration was not confirmed (${result.restore_status||result.status})`);await refresh()}catch(x){alert(x.message)}finally{buttons.forEach(x=>x.disabled=false)}};devices.appendChild(e)}document.getElementById('status').textContent=s.busy?'Bluetooth operation in progress…':`${s.devices.length} found · ready`}
async function scan(){try{await api('/api/scan',{seconds:Number(document.getElementById('seconds').value)});await refresh()}catch(e){alert(e.message)}}
async function exportConfig(){try{const x=await api('/api/export');alert(`Wrote ${x.config} and ${x.secrets}`)}catch(e){alert(e.message)}}
function esc(v){const e=document.createElement('span');e.textContent=String(v??'?');return e.innerHTML}refresh();
</script></body></html>
