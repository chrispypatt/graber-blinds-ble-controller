<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17211c">
  <title>Set up shades · Graber Control</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="setup-page">
  <div class="auth-screen" id="authScreen">
    <form class="auth-card" id="authForm">
      <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
      <h1>Shade setup</h1>
      <label class="field"><span>Setup key</span><input id="tokenInput" type="password" autocomplete="off" autofocus required placeholder="Paste setup key"></label>
      <button class="button primary wide" type="submit">Unlock setup</button>
      <p class="form-error" id="authError" role="alert"></p>
    </form>
  </div>
  <div class="app-shell is-hidden" id="appShell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Graber Control setup home"><span class="brand-mark small" aria-hidden="true"><span></span><span></span><span></span></span><span><strong>Graber Control</strong><small>Shade setup</small></span></a>
      <div class="topbar-actions"><span class="status-pill" id="connectionStatus"><i></i>Connecting</span><button class="button ghost compact" id="lockButton" type="button">Lock</button></div>
    </header>
    <main class="page-wrap">
      <section class="hero setup-hero">
        <div><h1>Set up shades</h1></div>
        <button class="button primary scan-button" id="scanButton" type="button"><span class="button-icon">⌁</span><span>Scan for shades</span></button>
      </section>
      <section class="stats-grid" aria-label="Setup summary">
        <article class="stat-card"><span class="stat-icon signal">⌁</span><div><strong id="foundCount">0</strong><small>shades</small></div></article><article class="stat-card"><span class="stat-icon check">✓</span><div><strong id="configuredCount">0</strong><small>configured</small></div></article><article class="stat-card"><span class="stat-icon radio">◉</span><div><strong id="adapterCount">0</strong><small>adapters</small></div></article>
      </section>
      <section class="content-section">
        <div class="section-heading split">
          <div><h2>Shades</h2><p id="deviceSummary">Run a scan to begin.</p></div>
          <div class="toolbar"><label class="search"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="Search shades" aria-label="Search shades"></label><label class="select-wrap"><span class="sr-only">Filter devices</span><select id="filterSelect"><option value="all">All shades</option><option value="needs_setup">Needs setup</option><option value="configured">Configured</option><option value="included">Included in export</option></select></label><details class="scan-settings"><summary>Scan settings</summary><label class="field compact-field"><span>Duration</span><input id="scanSeconds" type="number" value="12" min="3" max="60"><em>seconds</em></label></details></div>
        </div>
        <div class="empty-state" id="emptyState"><div class="empty-window" aria-hidden="true"><span></span></div><h3>No shades found</h3><button class="button primary" id="emptyScanButton" type="button">Scan for shades</button></div>
        <div class="device-grid" id="deviceGrid" aria-live="polite"></div>
      </section>
    </main>
    <footer class="review-bar" id="reviewBar"><div><strong id="reviewTitle">Nothing to export</strong><span id="reviewCopy">0 configured</span></div><button class="button primary" id="exportButton" type="button" disabled>Review &amp; export</button></footer>
  </div>
  <div class="modal-backdrop is-hidden" id="exportModal" role="dialog" aria-modal="true" aria-labelledby="exportTitle"><section class="modal-card"><button class="icon-button modal-close" data-close-modal aria-label="Close">×</button><h2 id="exportTitle">Review export</h2><div class="review-list" id="exportReview"></div><div class="modal-actions"><button class="button secondary" data-close-modal type="button">Back</button><button class="button primary" id="confirmExport" type="button">Export</button></div></section></div>
  <div class="toast-region" id="toasts" aria-live="polite"></div>
  <script src="/assets/setup.js" defer></script>
</body>
</html>
